services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: collab-relay:local
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_ROOM_MEMBERS: ${MAX_ROOM_MEMBERS:-50}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # --- Optional target infrastructure (docker compose --profile target up) ---
  redis:
    image: redis:7-alpine
    profiles: ["target"]
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    profiles: ["target"]
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
